name: Build ATA Visualizer Demo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ATA demo
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "ATA_Visualizer_Demo_Upload(1).zip" -d extracted
          test -f extracted/ata_visualizer_flutter_demo/pubspec.yaml
     
      - name: Create Android files
        working-directory: extracted/ata_visualizer_flutter_demo
        run: flutter create --platforms=android --org ir.atapaint .

      - name: Install packages
        working-directory: extracted/ata_visualizer_flutter_demo
        run: flutter pub get
      - name: Fix TFLite JVM compatibility
        working-directory: extracted/ata_visualizer_flutter_demo
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.parse

          config = json.loads(
              pathlib.Path(".dart_tool/package_config.json").read_text()
          )

          pkg = next(
              p for p in config["packages"]
              if p["name"] == "tflite_flutter"
          )

          uri = pkg["rootUri"]

          if uri.startswith("file://"):
              root = pathlib.Path(
                  urllib.parse.unquote(
                      urllib.parse.urlparse(uri).path
                  )
              )
          else:
              root = (
                  pathlib.Path(".dart_tool") / uri
              ).resolve()

          candidates = [
              root / "android" / "build.gradle",
              root / "android" / "build.gradle.kts",
          ]

          target = next(
              (p for p in candidates if p.exists()),
              None
          )

          if target is None:
              raise SystemExit(
                  f"TFLite Gradle file not found under {root}"
              )

          text = target.read_text()
          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )
          target.write_text(text)

          print("Patched:", target)
          PY
      - name: Build APK
        working-directory: extracted/ata_visualizer_flutter_demo
        run: flutter build apk --debug --dart-define=ATA_DEMO_MODE=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATA-Visualizer-Demo-APK
          path: extracted/ata_visualizer_flutter_demo/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
