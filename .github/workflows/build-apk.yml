
name: Build ATA Visualizer Demo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ATA demo
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q ATA_Visualizer_Demo_Upload.zip -d extracted
          test -f extracted/ata_visualizer_flutter_demo/pubspec.yaml

      - name: Create Android files
        working-directory: extracted/ata_visualizer_flutter_demo
        run: flutter create --platforms=android --org ir.atapaint .

      - name: Install packages
        working-directory: extracted/ata_visualizer_flutter_demo
        run: flutter pub get

      - name: Build APK
        working-directory: extracted/ata_visualizer_flutter_demo
        run: flutter build apk --debug --dart-define=ATA_DEMO_MODE=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATA-Visualizer-Demo-APK
          path: extracted/ata_visualizer_flutter_demo/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
